<main data-auth-required hidden><div class="wrap">
  <div class="mypage-card">
    <h1>마이페이지</h1>
    <p>로그인한 이메일</p>
    <strong data-user-email></strong>
    <div data-email-verification hidden>
      <p data-email-verification-message></p>
      <button class="btn ghost" type="button" data-resend-verification>인증 메일 다시 보내기</button>
      <p data-verification-status role="status" aria-live="polite"></p>
    </div>
    <button class="btn" type="button" data-mypage-signout>로그아웃</button>
  </div>
  <section class="orders">
    <h2>내 주문</h2>
    <p data-orders-empty role="status" aria-live="polite">주문을 불러오는 중…</p>
    <ul data-orders-list class="orders-list"></ul>
    <div class="orders-stopped-row">
      <p data-orders-stopped role="status" aria-live="polite" hidden>모든 주문이 끝나 실시간 확인을 멈췄습니다. 새로 고치면 다시 확인합니다.</p>
      <button class="btn ghost" type="button" data-orders-refresh hidden>다시 확인</button>
    </div>
  </section>
</div></main>

<footer class="site"><div class="wrap"></div></footer>

<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module">
  import { auth, logoutUser, resendVerificationEmail } from "./assets/auth.js";
  import { getFirestore, collection, query, where, onSnapshot, getDocs }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  // 내 주문: 로그인한 사람의 UID가 확인된 뒤 한 번만 듣는다
  const db = getFirestore(auth.app);
  const ordersList = document.querySelector("[data-orders-list]");
  const ordersEmpty = document.querySelector("[data-orders-empty]");
  const ordersStopped = document.querySelector("[data-orders-stopped]");
  const ordersRefresh = document.querySelector("[data-orders-refresh]");
  const FINAL_STATUSES = ["delivered", "canceled"];
  let ordersUnsubscribe = null;
  let listeningUid = null;

  const millis = o => (o.createdAt && o.createdAt.toMillis ? o.createdAt.toMillis() : Infinity);
  const dateText = o => (o.createdAt && o.createdAt.toDate
    ? o.createdAt.toDate().toLocaleString("ko-KR")
    : "처리 중");

  function paintOrders(orders) {
    ordersList.textContent = "";
    ordersEmpty.textContent = orders.length ? "" : "주문이 없습니다.";
    orders.forEach(o => {
      const li = document.createElement("li");
      const names = Array.isArray(o.items) ? o.items.map(i => i.name).join(", ") : "";
      const rows = [
        ["주문한 날", dateText(o)],
        ["상품", names],
        ["합계", Number(o.totalPrice).toLocaleString("ko-KR") + "원"],
        ["상태", String(o.status)]
      ];
      rows.forEach(([label, value]) => {
        const p = document.createElement("p");
        p.textContent = label + ": " + value;
        li.append(p);
      });
      ordersList.append(li);
    });
  }

  // 내 주문만 고르는 쿼리 (듣기와 다시 확인이 같이 쓴다)
  const ordersQuery = uid => query(collection(db, "orders"), where("userId", "==", uid));
  const toOrders = snap => snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => millis(b) - millis(a));   // 최신순은 받은 뒤 화면에서

  function listenOrders(uid) {
    if (listeningUid === uid) return;
    if (ordersUnsubscribe) ordersUnsubscribe();
    listeningUid = uid;
    ordersRefresh.hidden = true;   // 듣는 동안에는 「다시 확인」을 보이지 않는다
    ordersUnsubscribe = onSnapshot(ordersQuery(uid), snap => {
      console.log("[주문 알림] 주문 " + snap.size + "건 (서버 확인 전 변경 " + (snap.metadata.hasPendingWrites ? "있음" : "없음") + ")");
      const orders = toOrders(snap);
      paintOrders(orders);
      // 주문이 있고 전부 끝났으면(delivered · canceled) 더 바뀔 일이 없으니 그만 듣는다
      if (ordersUnsubscribe && orders.length && orders.every(o => FINAL_STATUSES.includes(o.status))) {
        ordersUnsubscribe();
        ordersUnsubscribe = null;
        ordersStopped.hidden = false;
        ordersRefresh.hidden = false;
        console.log("[그만 듣기] 모든 주문이 delivered 또는 canceled 라서 주문 듣기를 멈췄습니다.");
      }
    }, error => {
      console.log("[주문 알림] 주문을 듣지 못했습니다: " + (error.code || error.message));
      ordersEmpty.textContent = "주문을 불러오지 못했습니다. " + (error.code || error.message);
    });
  }

  // 「다시 확인」: 한 번만 읽고 끝낸다 (리스너는 다시 걸지 않는다)
  ordersRefresh.addEventListener("click", async () => {
    if (!listeningUid) return;
    ordersRefresh.disabled = true;
    try {
      paintOrders(toOrders(await getDocs(ordersQuery(listeningUid))));
    } catch (error) {
      ordersEmpty.textContent = "주문을 불러오지 못했습니다. " + (error.code || error.message);
    } finally {
      ordersRefresh.disabled = false;
    }
  });

  onAuthStateChanged(auth, user => {
    if (user) {
      listenOrders(user.uid);
    } else {
      if (ordersUnsubscribe) ordersUnsubscribe();
      ordersUnsubscribe = null;
      listeningUid = null;
      ordersRefresh.hidden = true;
    }
  });

  document.querySelector("[data-mypage-signout]").addEventListener("click", async () => {
    await logoutUser();
  });

  document.querySelector("[data-resend-verification]").addEventListener("click", async event => {
    const button = event.currentTarget;
    const status = document.querySelector("[data-verification-status]");
    button.disabled = true;
    status.textContent = "";
    try {
      await resendVerificationEmail();
      status.textContent = "인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.";
    } catch (error) {
      status.textContent = error.code === "auth/too-many-requests"
        ? "잠시 뒤에 다시 눌러 주세요."
        : error.code;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
