<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 화면 — CUT주방용품</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<script src="assets/consent.js"></script>

<style>
  .ad-page{max-width:560px;margin:0 auto;padding:72px 24px 96px}
  .ad-page h1{margin:0 0 16px;font-size:26px;letter-spacing:-.04em}
  .ad-result{margin:0 0 16px;font-size:16px;font-weight:700;line-height:1.6}
  .ad-error{margin:12px 0 0;color:#b42318;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
  .ad-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
</style>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5P374PG9"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<main class="ad-page">
  <h1>관리 화면</h1>
  <p id="ad-loading">확인하는 중…</p>
  <p id="ad-login" hidden>로그인이 필요합니다 <a href="/login.html">로그인</a></p>
  <section id="ad-main" hidden>
    <p id="ad-result" class="ad-result" role="status" aria-live="polite"></p>
    <div>
      <button class="btn" id="ad-grant" type="button" hidden>주인 명찰 받기</button>
    </div>
    <p id="ad-error" class="ad-error" role="alert"></p>
    <div class="ad-actions">
      <button class="btn ghost" id="ad-recheck" type="button">다시 확인</button>
    </div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDavrwZtFJrgJXWEe_GPlr4QHXpMlMBsvw",
    authDomain: "haru-ch-shop.firebaseapp.com",
    projectId: "haru-ch-shop",
    storageBucket: "haru-ch-shop.firebasestorage.app",
    messagingSenderId: "971703720070",
    appId: "1:971703720070:web:df10e702482b8882475907"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const grantOwnerRole = httpsCallable(getFunctions(app, "us-central1"), "grantOwnerRole");

  const loading = document.querySelector("#ad-loading");
  const loginNeeded = document.querySelector("#ad-login");
  const main = document.querySelector("#ad-main");
  const result = document.querySelector("#ad-result");
  const errorBox = document.querySelector("#ad-error");
  const grantBtn = document.querySelector("#ad-grant");
  const recheckBtn = document.querySelector("#ad-recheck");

  const errText = e => (e && e.code ? e.code + ": " : "") + (e && e.message ? e.message : String(e));

  // 로그인 토큰의 커스텀 클레임 role 로만 판단한다 (forceRefresh 이면 토큰을 새로 받는다)
  async function judge(forceRefresh) {
    const user = auth.currentUser;
    loading.hidden = true;
    loginNeeded.hidden = !!user;
    main.hidden = !user;
    if (!user) return;
    const { claims } = await user.getIdTokenResult(forceRefresh);
    const role = claims.role;
    const isStaff = role === "staff" || role === "admin";
    result.textContent = isStaff ? "관리자: " + role : "권한이 없습니다";
    grantBtn.hidden = isStaff;
  }

  async function safeJudge(forceRefresh) {
    try {
      await judge(forceRefresh);
    } catch (e) {
      errorBox.textContent = errText(e);
    }
  }

  onAuthStateChanged(auth, () => {
    errorBox.textContent = "";
    safeJudge(false);
  });

  grantBtn.addEventListener("click", async () => {
    grantBtn.disabled = true;
    errorBox.textContent = "";
    try {
      await grantOwnerRole();
    } catch (e) {
      errorBox.textContent = errText(e);
      grantBtn.disabled = false;
      return;
    }
    grantBtn.disabled = false;
    await safeJudge(true);
  });

  recheckBtn.addEventListener("click", async () => {
    recheckBtn.disabled = true;
    errorBox.textContent = "";
    await safeJudge(true);
    recheckBtn.disabled = false;
  });
</script>
</body>
</html>
