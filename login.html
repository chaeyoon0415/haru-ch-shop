<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — CUT주방용품</title>
<meta name="description" content="CUT주방용품 회원 가입과 로그인">
<link rel="stylesheet" href="assets/style.css">

<script src="assets/consent.js"></script>

<style>
  .auth-page{max-width:460px;margin:0 auto;padding:72px 24px 96px}
  .auth-card{padding:32px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  .auth-card h1{margin:0 0 8px;font-size:30px;letter-spacing:-.04em}
  .auth-card .lead{margin-bottom:28px}
  .auth-field{display:grid;gap:7px;margin-bottom:18px;font-size:14px;font-weight:700}
  .auth-field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}
  .auth-field input:focus{outline:2px solid #b9cdbf;outline-offset:1px;border-color:var(--accent)}
  .auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
  .auth-actions .auth-note{grid-column:1 / -1;margin:0;color:var(--sub);font-size:12px;line-height:1.5}
  .auth-actions .logout{grid-column:1 / -1}
  .auth-status{min-height:1.7em;margin:20px 0 0;color:var(--sub);font-size:14px}
  .auth-status.error{color:#b42318}
  @media (max-width:520px){.auth-page{padding-top:48px}.auth-card{padding:24px}}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5P374PG9"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header class="site"><div class="wrap">
  <a class="brand" href="index.html">CUT 주방 용품</a>
  <nav class="site"><a href="index.html">상품</a><a href="cart.html">장바구니</a><span data-auth-menu></span></nav>
</div></header>

<main class="auth-page">
  <section class="auth-card" aria-labelledby="auth-title">
    <h1 id="auth-title">CUT 주방 용품 계정</h1>
    <p class="lead">이메일로 가입하거나 로그인하세요.</p>
    <form id="auth-form">
      <label class="auth-field" for="email">이메일
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <label class="auth-field" for="password">비밀번호
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="auth-actions">
        <button class="btn" id="signup" type="button">가입</button>
        <button class="btn ghost" id="signin" type="button">로그인</button>
        <p class="auth-note">도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, CUT주방용품을 다 보신 뒤 로그아웃을 눌러 주세요.</p>
        <button class="btn ghost logout" id="signout" type="button">로그아웃</button>
      </div>
    </form>
    <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
  </section>
</main>

<script type="module">
  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendEmailVerification,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { auth } from "./assets/auth.js";
  const email = document.querySelector("#email");
  const password = document.querySelector("#password");
  const status = document.querySelector("#auth-status");

  function showStatus(message, isError = false) {
    status.textContent = message;
    status.classList.toggle("error", isError);
  }

  function credentials() {
    if (!email.reportValidity() || !password.reportValidity()) return null;
    return { email: email.value, password: password.value };
  }

  async function run(action, successMessage) {
    const input = credentials();
    if (!input) return;
    try {
      const credential = await action(auth, input.email, input.password);
      if (action === createUserWithEmailAndPassword) {
        window.dataLayer = window.dataLayer || [];
        dataLayer.push({ event: "sign_up", method: "email" });
        auth.languageCode = "ko";
        await sendEmailVerification(credential.user);
        location.replace("mypage.html?verificationEmailSent=1");
        return;
      }
      showStatus(successMessage);
    } catch (error) {
      showStatus(error.code, true);
    }
  }

  document.querySelector("#signup").addEventListener("click", () => {
    run(createUserWithEmailAndPassword, "가입되었습니다.");
  });

  document.querySelector("#signin").addEventListener("click", () => {
    run(signInWithEmailAndPassword, "로그인되었습니다.");
  });

  document.querySelector("#signout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      showStatus("로그아웃되었습니다.");
    } catch (error) {
      showStatus(error.code, true);
    }
  });
</script>
</body>
</html>
