<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 사진 올리기 — CUT주방용품</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<script src="assets/consent.js"></script>

<style>
  .upload-page{max-width:520px;margin:0 auto;padding:72px 24px 96px}
  .upload-page h1{margin:0 0 24px;font-size:26px;letter-spacing:-.04em}
  .upload-field{display:grid;gap:7px;margin-bottom:18px;font-size:14px;font-weight:700}
  .upload-field select,.upload-field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}
  #upload-msg{margin:20px 0 0;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
</style>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5P374PG9"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<main class="upload-page">
  <p id="login-needed" hidden>로그인한 뒤에 쓸 수 있습니다. <a href="login.html">로그인</a></p>
  <section id="upload-form" hidden>
    <h1>상품 사진 올리기</h1>
    <label class="upload-field" for="product-select">상품
      <select id="product-select"><option value="">상품을 읽는 중…</option></select>
    </label>
    <label class="upload-field" for="photo-file">사진 파일
      <input id="photo-file" type="file" accept="image/*">
    </label>
    <button class="btn" id="upload-photo" type="button">사진 올리기</button>
    <p id="upload-msg" role="status" aria-live="polite"></p>
  </section>
</main>

<script type="module" src="assets/upload.js"></script>
</body>
</html>
